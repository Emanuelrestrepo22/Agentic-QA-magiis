# ============================================
# Claude Code — GitHub App integration
# ============================================
# Purpose: run Claude inside GitHub Actions on demand. Mention @claude in an
# issue, an issue comment, a PR review or a PR review comment and this workflow
# picks it up. It does NOT run on every push — the `if:` guard below keeps it
# scoped to explicit @claude mentions so it never burns CI minutes/API tokens
# by accident.
#
# Setup (interactive, done by the repo owner — see plan):
#   1. Install the Claude GitHub App: https://github.com/apps/claude  (or run
#      `/install-github-app` in Claude Code, which also generates this file).
#   2. Add the repo secret ANTHROPIC_API_KEY (console.anthropic.com). To bill
#      against a Claude subscription instead, use `claude setup-token` and swap
#      the input below for `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}`.
#
# Trifuerza DB (Oracle) in CI is OPT-IN and NOT wired here — .env is local-only
# and invisible to Actions. Only add the Oracle secrets + an `env:` block if you
# genuinely need @claude to run DB-touching tests, and use a read-only DB user.
# ============================================

name: Claude Code
run-name: ${{ github.actor }} invoked @claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when the text actually mentions @claude (avoids wasted runs).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    name: Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional cost/behavior controls:
          # claude_args: "--max-turns 15 --model claude-sonnet-5"
